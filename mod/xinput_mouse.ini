; xinput_mouse.ini - dual input proxy for Warhammer 40,000: Space Marine 2 (gyro/mouse look + gamepad at once)
[Mouse]
; 1 = mouse/gyro look is injected into the gamepad camera, 0 = pure pass-through. F10 toggles at runtime (game window focused)
Enabled=1
; multiplier on top of the game's own mouse sensitivity (native mouse scale = 1.0)
GyroSensitivity=1.0
; 1 = inject only into the gameplay camera action (fingerprint of its bindings); 0 = inject into ALL rotate actions (debug only, breaks menus)
CameraMatch=1
; 1 = right stick (Steam right trackpad) above StickOverrideDeadzone discards the gyro (stick read from the camera action's command values)
TrackpadOverride=1
; fraction of full stick travel (0..1) above which the real right stick wins
StickOverrideDeadzone=0.27
; 1 = flip the horizontal axis
InvertX=0
; 1 = flip the vertical axis (on top of the game's own invert-mouse-look option)
InvertY=0
; 0 = mouse Y -> first GetRotation output, mouse X -> second; 1 = swapped (use if yaw/pitch are crossed)
SwapAxes=0
; XInput user index (diagnostics only; the override no longer uses XInput)
PadIndex=0
; 1 = force the game's focus device to the gamepad whenever it switches to mouse (breaks native mouse look!)
ForceGamepadFocus=0
; write mixed_input.log next to the DLL
Log=1
; extra diagnostics in the log (device list, command values, status lines)
Diag=1
